# The Postgres oracle: restore one month of NHTSA's dump into Postgres 17,
# run its own vpic.spvindecode over a VIN list on the stock dump and on the
# freshened copy (ADR 0006), and upload both answer keys with the stale-cache
# list and the witness re-check against live vPIC.
# Reusable (workflow_call) for the refresh gates, which run it once per file
# of a generated VIN list (refresh.yml); dispatchable by hand.
# The commands live in scripts/oracle.sh so a workstation runs the same ones.
name: Postgres oracle

on:
  workflow_call:
    inputs:
      month:
        description: Data month YYYY_MM; empty means the newest one NHTSA publishes
        type: string
        default: ""
      vins:
        description: VIN list in the checkout (VIN, optional tab and model-year hint); every deviation witness is added
        type: string
        default: testdata/oracle/sample-vins.tsv
      vins-artifact:
        description: >-
          Name of an artifact of the calling run to download into the checkout,
          under a directory of that name, before reading vins: a list the run generated
        type: string
        default: ""
      artifact:
        description: Name to upload the results under; empty means oracle-<month>
        type: string
        default: ""
    outputs:
      month:
        description: Data month decoded
        value: ${{ jobs.oracle.outputs.month }}
      dump-bytes:
        description: Size of vPICList_lite_<month>.custom.zip
        value: ${{ jobs.oracle.outputs.dump-bytes }}
      dump-sha256:
        description: SHA-256 of vPICList_lite_<month>.custom.zip
        value: ${{ jobs.oracle.outputs.dump-sha256 }}
      artifact:
        description: >-
          Name of the uploaded artifact: corpus.tsv, {stock,freshened}/answer-key.csv
          and vin-ms.tsv, stale-cache.jsonl, witnesses.jsonl, manifest.json
        value: ${{ jobs.oracle.outputs.artifact }}
  workflow_dispatch:
    inputs:
      month:
        description: Data month YYYY_MM; empty means the newest one NHTSA publishes
        type: string
        default: ""
      vins:
        description: VIN list in the checkout (VIN, optional tab and model-year hint); every deviation witness is added
        type: string
        default: testdata/oracle/sample-vins.tsv

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, so `| tee` cannot hide a failed fetch.
    shell: bash

jobs:
  oracle:
    runs-on: ubuntu-24.04
    # On this 4-CPU runner, 2026_10 decodes in about 0.11 s per VIN stock and
    # 0.20 s freshened (manifest.json: timings, keys.*.vin_ms), and the rest
    # of the job takes about a minute: about 27 minutes for the 5,007 VINs of
    # a refresh shard (ADR 0008's bound per job), so 45 leaves room for a
    # month or a list that decodes slower.
    timeout-minutes: 45
    services:
      postgres:
        # The custom dump is archive format 1.16: pg_restore 17 or newer.
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vpic
          # Collate C, ctype left at en_US.utf8: ultravin's oracle contract,
          # as scripts/oracle.sh up (its header says why). restore and decode
          # refuse any other collation.
          POSTGRES_INITDB_ARGS: --lc-collate=C
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    outputs:
      month: ${{ steps.fetch.outputs.month }}
      dump-bytes: ${{ steps.fetch.outputs.dump_bytes }}
      dump-sha256: ${{ steps.fetch.outputs.dump_sha256 }}
      artifact: ${{ inputs.artifact || format('oracle-{0}', steps.fetch.outputs.month) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        with:
          tools: jq

      - name: Download the VIN list
        if: inputs.vins-artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.vins-artifact }}
          path: ${{ inputs.vins-artifact }}

      - name: Prepare
        run: |
          {
            echo "ORACLE_CONTAINER=${{ job.services.postgres.id }}"
            echo "ORACLE_TIMINGS=$RUNNER_TEMP/timings.tsv"
            echo "ORACLE_OUT=$RUNNER_TEMP/out"
            echo "ORACLE_STARTED=$(date +%s)"
            echo "ORACLE_DISK_BEFORE=$(df -B1 --output=used / | tail -n 1 | tr -d ' ')"
          } >>"$GITHUB_ENV"

      - name: Resolve data month
        id: month
        env:
          MONTH: ${{ inputs.month }}
        run: echo "month=${MONTH:-$(scripts/oracle.sh month)}" >>"$GITHUB_OUTPUT"

      - name: Fetch dump
        id: fetch
        run: scripts/oracle.sh fetch "${{ steps.month.outputs.month }}" "$RUNNER_TEMP/dump" | tee -a "$GITHUB_OUTPUT"

      - name: Restore dump
        run: scripts/oracle.sh restore "${{ steps.fetch.outputs.backup }}"

      - name: Freshen a copy
        run: scripts/oracle.sh freshen

      - name: Build the corpus
        env:
          VINS: ${{ inputs.vins }}
        run: |
          mkdir -p "$ORACLE_OUT/stock" "$ORACLE_OUT/freshened"
          scripts/oracle.sh corpus "$VINS" >"$ORACLE_OUT/corpus.tsv"

      - name: Decode, stock
        run: scripts/oracle.sh decode stock "$ORACLE_OUT/corpus.tsv" "$ORACLE_OUT/stock/answer-key.csv" "$ORACLE_OUT/stock/vin-ms.tsv"

      - name: Decode, freshened
        run: scripts/oracle.sh decode freshened "$ORACLE_OUT/corpus.tsv" "$ORACLE_OUT/freshened/answer-key.csv" "$ORACLE_OUT/freshened/vin-ms.tsv"

      - name: Detect the stale-cache class
        run: scripts/oracle.sh stale-cache "$ORACLE_OUT/stock/answer-key.csv" "$ORACLE_OUT/freshened/answer-key.csv" "$ORACLE_OUT/stale-cache.jsonl"

      # Reports; a disagreement or an unreachable vPIC never fails it.
      - name: Re-check witnesses against live vPIC
        run: scripts/oracle.sh recheck "$ORACLE_OUT/stock/answer-key.csv" "$ORACLE_OUT/freshened/answer-key.csv" "$ORACLE_OUT/witnesses.jsonl"

      - name: Write manifest
        env:
          VINS: ${{ inputs.vins }}
          MONTH: ${{ steps.fetch.outputs.month }}
          DUMP_BYTES: ${{ steps.fetch.outputs.dump_bytes }}
          DUMP_SHA256: ${{ steps.fetch.outputs.dump_sha256 }}
        run: |
          q() { docker exec "$ORACLE_CONTAINER" psql -X -tA -U postgres -d "$1" -c "$2"; }
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          # One answer key: its mode, its database and its per-VIN cost.
          key() {
            jq -n \
              --arg mode "$1" \
              --arg database "$2" \
              --argjson wmiyearvalidchars_rows "$(q "$2" 'select count(*) from vpic.wmiyearvalidchars')" \
              --argjson answer_rows "$(q "$2" 'select count(*) from oracle.answer_key')" \
              --arg answer_key_sha256 "$(sha "$ORACLE_OUT/$1/answer-key.csv")" \
              --argjson vin_ms "$(q "$2" "select json_build_object('mean', round(avg(ms), 1),
                  'median', round(percentile_cont(0.5) within group (order by ms)::numeric, 1),
                  'max', max(ms), 'total', round(sum(ms))) from oracle.vin_time")" \
              '$ARGS.named'
          }
          # started_at: the job's start, the instant pkg/decoder's TestParity
          # decodes this run's key at (-parity-run, -update-parity).
          jq -n \
            --arg month "$MONTH" \
            --argjson dump_bytes "$DUMP_BYTES" \
            --arg dump_sha256 "$DUMP_SHA256" \
            --arg started_at "$(date -u -d "@$ORACLE_STARTED" +%Y-%m-%dT%H:%M:%SZ)" \
            --arg vins "$VINS" \
            --arg vins_sha256 "$(sha "$VINS")" \
            --arg corpus_sha256 "$(sha "$ORACLE_OUT/corpus.tsv")" \
            --argjson vin_count "$(q vpic 'select count(*) from oracle.input')" \
            --argjson keys "$(jq -n --argjson stock "$(key stock vpic)" --argjson freshened "$(key freshened vpic_fresh)" '$ARGS.named')" \
            --argjson stale_cache "$(jq -n --argjson vins "$(wc -l <"$ORACLE_OUT/stale-cache.jsonl")" \
                --arg jsonl_sha256 "$(sha "$ORACLE_OUT/stale-cache.jsonl")" '$ARGS.named')" \
            --argjson witnesses "$(jq -s '{checked: length, agree: (map(select(.agrees == true)) | length),
                disagree: (map(select(.agrees == false)) | length), unchecked: (map(select(.error)) | length),
                fields: (map(.fields // 0) | add // 0)}' "$ORACLE_OUT/witnesses.jsonl")" \
            --arg server "$(q vpic 'show server_version')" \
            --arg collate "$(q vpic "select datcollate from pg_database where datname = 'vpic'")" \
            --arg ctype "$(q vpic "select datctype from pg_database where datname = 'vpic'")" \
            --arg pg_restore "$(docker exec "$ORACLE_CONTAINER" pg_restore --version)" \
            --argjson database_bytes "$(q vpic "select pg_database_size('vpic')")" \
            --argjson disk_used_bytes "$(( $(df -B1 --output=used / | tail -n 1) - ORACLE_DISK_BEFORE ))" \
            --argjson wall_seconds "$(( $(date +%s) - ORACLE_STARTED ))" \
            --arg runner "$ImageOS $ImageVersion, $(nproc) CPU" \
            --rawfile timings "$ORACLE_TIMINGS" \
            '$ARGS.named | .timings = ($timings | split("\n") | map(select(. != "") | split("\t") | {(.[0]): (.[1] | tonumber)}) | add)' \
            >"$ORACLE_OUT/manifest.json"
          cat "$ORACLE_OUT/manifest.json"
          {
            echo "### Postgres oracle, data month $MONTH"
            echo
            echo '| Measure | Value |'
            echo '| --- | --- |'
            jq -r 'del(.keys, .stale_cache, .witnesses, .timings) | to_entries[] | "| \(.key) | \(.value) |"' "$ORACLE_OUT/manifest.json"
            jq -r '.timings | to_entries[] | "| seconds: \(.key) | \(.value) |"' "$ORACLE_OUT/manifest.json"
            echo
            echo '| Key | wmiyearvalidchars rows | Answer rows | ms per VIN: mean | median | max | total | SHA-256 |'
            echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
            jq -r '.keys[] | "| \(.mode) | \(.wmiyearvalidchars_rows) | \(.answer_rows) | \(.vin_ms.mean) | \(.vin_ms.median) | \(.vin_ms.max) | \(.vin_ms.total) | `\(.answer_key_sha256)` |"' "$ORACLE_OUT/manifest.json"
            echo
            jq -r '"**stale-cache**: \(.stale_cache.vins) of \(.vin_count) VINs differ between the stock and freshened keys (`stale-cache.jsonl`)."' "$ORACLE_OUT/manifest.json"
            echo
            echo '| Witness | Class | Live vPIC | Fields | Stock ≠ freshened | Disagreeing elements |'
            echo '| --- | --- | --- | --- | --- | --- |'
            jq -r '"| `\(.vin)` | \(.class) | \(if .error then "unchecked: \(.error)" elif .agrees then "agrees" else "**disagrees**" end) | \(.fields // "") | \(.disputed // "") | \(.disagree // [] | map("\(.element) \(.code)") | join(", ")) |"' "$ORACLE_OUT/witnesses.jsonl"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact || format('oracle-{0}', steps.fetch.outputs.month) }}
          path: ${{ env.ORACLE_OUT }}
          if-no-files-found: error
