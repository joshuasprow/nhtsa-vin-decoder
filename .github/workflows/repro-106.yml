# Throwaway (#106), removed before merge: release.yml's snapshot built four
# times on one commit: twice with the per-tool actions it used before
# (setup-go, setup-zig, goreleaser-action "~> v2"), the baseline of what a
# rebuild reproduces at all, and twice with the mise step. Every file under
# dist/ and build/ is hashed, and each package's payload files too. Every
# build sets each tracked file's mtime to the commit's, so archives do not
# carry the checkout time. The comparison is made from the artifacts.
name: Repro 106

on:
  push:
    branches: [task/mise-106]
    paths: [.github/workflows/repro-106.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        variant: [old, old-again, mise, mise-again]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - if: "!startsWith(matrix.variant, 'mise')"
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: "!startsWith(matrix.variant, 'mise')"
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - if: startsWith(matrix.variant, 'mise')
        uses: ./.github/actions/mise
        with:
          tools: go zig goreleaser jq
      - uses: docker/setup-buildx-action@v4
      - name: Commit-time mtimes
        run: git ls-files -z | xargs -0 touch -h -d "@$(git log -1 --format=%ct)"
      - name: Read the embedded data month
        run: echo "DATA_MONTH=$(go run ./cmd/nitrovin info | jq -r .data_month)" | tee -a "$GITHUB_ENV"
      - if: "!startsWith(matrix.variant, 'mise')"
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
        env:
          HOMEBREW_TAP_DEPLOY_KEY: unused
          SCOOP_BUCKET_DEPLOY_KEY: unused
      - if: startsWith(matrix.variant, 'mise')
        env:
          HOMEBREW_TAP_DEPLOY_KEY: unused
          SCOOP_BUCKET_DEPLOY_KEY: unused
        run: goreleaser release --snapshot --clean --skip=sign
      - name: Tools and hashes
        run: |
          mkdir -p out/lib
          {
            echo "go: $(go version) at $(command -v go)"
            echo "zig: $(zig version) at $(command -v zig)"
            echo "jq: $(jq --version)"
            echo "commit: $(git rev-parse HEAD)"
          } | tee out/tools.txt
          find dist build -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum >out/hashes.txt
          command -v rpm2cpio >/dev/null || sudo apt-get install -y -qq rpm2cpio cpio >/dev/null
          # Each package's payload, file by file.
          for p in dist/*.deb dist/*.rpm dist/*.apk; do
            x=$(mktemp -d)
            case $p in
              *.deb) dpkg-deb -x "$p" "$x" ;;
              *.rpm) (cd "$x" && rpm2cpio "$OLDPWD/$p" | cpio -idm --quiet) ;;
              *.apk) tar -xzf "$p" -C "$x" 2>/dev/null ;;
            esac
            (cd "$x" && find . -type f ! -name '.PKGINFO' ! -name '.SIGN*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | sed "s|  \./|  ${p#dist/}:|"
          done >out/payloads.txt
          for f in build/libnitrovin/*/libnitrovin.*; do
            echo "$f $(go tool buildid "$f" 2>&1)"
          done | tee out/buildids.txt
          cp -r build/libnitrovin/. out/lib/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}
          path: out/

  # tools.yml's outdated job, verbatim: it cannot be dispatched before tools.yml is on main.
  outdated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        with:
          tools: jq node
      - name: Report
        run: |
          scripts/tools.sh outdated >"$RUNNER_TEMP/rows.md"
          title="Tools: newer releases upstream"
          issue=$(gh issue list --state open --json number,title -L 100 |
            jq -r --arg t "$title" 'map(select(.title == $t))[0].number // ""')
          if [ -s "$RUNNER_TEMP/rows.md" ]; then
            {
              echo "Pins with a newer release upstream, as of the [weekly check]($RUN_URL). Nothing is bumped by this issue."
              echo
              cat "$RUNNER_TEMP/rows.md"
              echo
              # shellcheck disable=SC2016 # Markdown code spans, not expansions
              echo 'Bump in a pull request: edit `mise.toml`, run `mise lock --platform macos-arm64,macos-x64,linux-x64,linux-arm64,windows-x64` and commit both files; wrangler is `npm install -E wrangler@<version>` in `deploy/cloudflare/worker`; postgres:17 is its digest in the workflows and `scripts/oracle.sh`.'
            } >"$RUNNER_TEMP/body.md"
            cat "$RUNNER_TEMP/body.md" >>"$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
          else
            echo "Every pin is current." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Every pin is current as of $RUN_URL."
            fi
          fi
