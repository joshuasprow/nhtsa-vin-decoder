# Throwaway (#124): the miss-path probe from a GitHub runner. Removed
# before the pull request merges.
name: Latency (#124)

on:
  pull_request:
    paths:
      - .github/latency-124.sh
      - .github/workflows/latency-124.yml

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Runner location
        run: |
          curl -sS --max-time 5 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' || echo "no Azure metadata"
          echo
      - name: Miss path, 20 decodes
        run: .github/latency-124.sh 20 | tee -a "$GITHUB_STEP_SUMMARY"
