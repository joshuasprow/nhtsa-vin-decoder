# The decode contract layer without a dump: pkg/contract's request parsing
# and both layouts, every decode of the committed oracle answer key checked
# against docs/api/decode.schema.json; pkg/vocab's faults, the synthetic
# vocabulary fixture against docs/api/vocabulary.schema.json and its drift
# against the embedded data; pkg/nitrovin vetted; the CLI's usage, refusal,
# unloadable-data and vocabulary cases, and a decode on its embedded data;
# the EPA vocabulary builder on a sample of vehicles.csv, against the same.
# The same decodes on the engine's output, and the CLI's decodes of the
# answer key, need an artifact: import.yml's artifact job runs them.
name: Contract

on:
  pull_request:
    paths:
      - pkg/contract/**
      - pkg/nitrovin/**
      - pkg/decoder/**
      - pkg/vocab/**
      - cmd/nitrovin/**
      - cmd/nitrovin-epa/**
      - testdata/vocab/**
      - docs/api/decode.schema.json
      - docs/api/mcp-tools.json
      - docs/api/openapi.yaml
      - docs/api/vocabulary.schema.json
      - go.mod
      - go.sum
      - mise.toml
      - mise.lock
      - .github/actions/mise/**
      - .github/workflows/contract.yml
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go
      # As import.yml: Go version, go.sum and the Go sources name the entry.
      # A first run on a branch falls back to the artifact job's entry, which
      # import.yml's runs on main keep current.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: go vet ./pkg/contract/ ./pkg/nitrovin/ ./pkg/vocab/ ./cmd/nitrovin/ ./cmd/nitrovin-epa/
      - run: go test -count=1 ./pkg/contract/ ./pkg/nitrovin/ ./pkg/vocab/ ./cmd/nitrovin/ ./cmd/nitrovin-epa/
