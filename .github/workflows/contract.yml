# The decode contract layer without a dump: pkg/contract's request parsing
# and both layouts, every decode of the committed oracle answer key checked
# against docs/api/decode.schema.json; pkg/vocab's faults, the synthetic
# vocabulary and catalog fixtures against docs/api/vocabulary.schema.json
# and their drift against the embedded data; pkg/nitrovin vetted; the
# CLI's usage, refusal, unloadable-data and vocabulary cases, and a decode
# on its embedded data;
# the EPA vocabulary builder on a sample of vehicles.csv, against the same;
# the pages (pkg/ui), the decode form among them in the runner's headless
# Chrome, with JavaScript and without, audited by axe (TestForm, which CI
# set makes fail without a browser); the browser's Service Worker (ADR
# 0013) built for js/wasm and run in the same Chrome against the server's
# answers (TestWorker), and the page's dialog with JavaScript and without,
# audited by axe, each finding of the browser prototype's review a step
# (TestVocabPage); the demo set (pkg/ui/demo) checked against the
# embedded month (TestDemoCheck), loaded in one click in the same Chrome
# (TestWorkerDemo) and answering as a server does on the same files
# (TestLibraryDemoFit); and the packages it runs built for js/wasm. The
# same decodes on the engine's output, and the CLI's decodes of the answer
# key, need an artifact: import.yml's artifact job runs them.
name: Contract

on:
  pull_request:
    paths:
      - pkg/contract/**
      - pkg/nitrovin/**
      - pkg/decoder/**
      - pkg/vocab/**
      - pkg/fitment/**
      - pkg/ui/**
      - cmd/nitrovin/**
      - cmd/nitrovin-epa/**
      - cmd/nitrovin-sw/**
      - scripts/sw.sh
      - testdata/vocab/**
      - docs/api/decode.schema.json
      - docs/api/mcp-tools.json
      - docs/api/openapi.yaml
      - docs/api/vocabulary.schema.json
      - go.mod
      - go.sum
      - mise.toml
      - mise.lock
      - .github/actions/mise/**
      - .github/workflows/contract.yml
      - "!**/*.md"
      # Re-included after the exclusion (order matters): TestFormREADME
      # holds the README's install, MCP and verify text to the form's, and
      # TestDemoWalkthrough the demo set's walkthrough to its list.
      - README.md
      - docs/vocabularies.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go jq
      # As import.yml: Go version, go.sum and the Go sources name the entry.
      # A first run on a branch falls back to the artifact job's entry, which
      # import.yml's runs on main keep current.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-contract-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - run: go vet ./pkg/contract/ ./pkg/nitrovin/ ./pkg/vocab/ ./pkg/fitment/ ./pkg/ui/ ./cmd/nitrovin/ ./cmd/nitrovin-epa/
      # Every test that runs the vocabulary fixture (testdata/vocab) or the
      # EPA sample against the embedded month must pass, never skip. They
      # assert against whatever month go.mod pins, so on the refresh's bump
      # PR a month that breaks one fails here, and the test names the month.
      - name: Test
        shell: bash
        run: |
          go test -count=1 -json ./pkg/contract/ ./pkg/nitrovin/ ./pkg/vocab/ ./pkg/fitment/ ./pkg/ui/ ./cmd/nitrovin/ ./cmd/nitrovin-epa/ |
            tee "$RUNNER_TEMP/test.json" | jq -rj 'select(.Action == "output") | .Output'
          month=$(jq -r .data_month "$(go list -m -f '{{.Dir}}' github.com/joshuasprow/nitrovin-data)/pkg/embedded/manifest.json")
          passed=$(jq -r 'select(.Action == "pass" and .Test != null) | "\(.Package | ltrimstr("github.com/joshuasprow/nitrovin/")) \(.Test)"' "$RUNNER_TEMP/test.json")
          required=(
            "pkg/nitrovin "{TestFixtureLoadsClean,TestFixtureDrift,TestTranslatorRefusesUnlinked,TestTranslate,TestTranslateAnswer}
            "pkg/nitrovin "{TestTranslateBatch,TestTranslateDrift,TestTranslateWithoutFiles,TestList,TestListPaging,TestSpineBundleTranslates}
            "pkg/nitrovin "{TestCatalogLoads,TestCatalogDrift}
            "cmd/nitrovin "{TestVocabCheck,TestVocabLoad,TestServeVocabularies,TestVocabCheckCatalog,TestTranslate,TestTranslateRefused,TestList,TestListRefused}
            "cmd/nitrovin "{TestStdioOps,TestMCPVocabSession,TestWorker,TestWorkerCatalog,TestWorkerCatalogParts,TestWorkerStock,TestVocabPage,TestVocabTranslate,TestVocabPartTargets}
            "cmd/nitrovin "{TestDemoCheck,TestDemoHints,TestWorkerDemo}
            "pkg/ui "{TestLibraryDemoFit,TestDemoPanel,TestDemoWalkthrough}
            "cmd/nitrovin-epa "{TestBuild,TestEntry,TestCuratedLoadsClean}
          )
          status=0
          for t in "${required[@]}"; do
            grep -qxF "$t" <<<"$passed" || { echo "contract: $t did not pass on data month $month" >&2; status=1; }
          done
          exit "$status"
      # The Service Worker's packages never import the embedded data, the
      # decoder or pkg/nitrovin, so they build for the browser; the module
      # itself (cmd/nitrovin-sw) is js/wasm alone.
      - run: GOOS=js GOARCH=wasm go vet ./cmd/nitrovin-sw/
      - run: GOOS=js GOARCH=wasm go build ./pkg/vocab/ ./pkg/fitment/ ./pkg/contract/ ./pkg/ui/ ./cmd/nitrovin-sw/
