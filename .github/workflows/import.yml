# The tests that need data, in three jobs, so a change runs what it can affect.
#
# artifact: every test that wants only an artifact, on the one go.mod pins
# (nitrovin-data's pkg/embedded, read from the module cache): pkg/decoder's
# TestParity holds the engine to the frozen answer key of
# testdata/parity/<month>/ offline; pkg/contract's TestEngineAnswerKey runs
# the decode contract on the engine's output; cmd/nitrovin's tests run the
# built CLI on it (`decode -` over the answer key's VINs gives the contract
# layer's bytes, the -o text transcript, every HTTP operation, a stdio
# session, MCP sessions, the form); cmd/nitrovin-import's
# TestVinsCoversTheMonth generates the refresh's VIN list from it: every WMI
# reached, no file over 5,000 VINs, nothing added that raises. The pinned
# month is always the keys' month (the refresh moves them together), so every
# one of them must pass, never skip. Runs for every path this workflow watches.
#
# postgres: one month restored into Postgres 17, and the tests that compare
# against it. cmd/nitrovin-import's TestPostgres builds the artifact twice and
# checks it against the database (row counts, NULL and empty-string counts,
# sampled rows, one hash); pkg/decoder's TestMatcherPostgres checks the
# pattern matcher and the per-schema index on every distinct pattern key
# against Postgres's LIKE and ~; TestCharsetPostgres checks the recomputed
# (WMI, year) charsets against fExtractValidCharsPerWmiYear and logs the
# stale-cache cells; TestCorePostgres checks whole passes against the
# freshened spvindecode_core; TestWrapperPostgres checks whole decodes, before
# value resolution, against the freshened spvindecode, with and without
# model-year hints; TestProjectionPostgres checks the projected rows against
# the whole freshened spvindecode on the same calls, and
# TestElementAttributeValuePostgres the resolution against
# fElementAttributeValue. It runs only when the changes job finds a path that
# can move those answers: the decoder, the contract package it imports, the
# importer, the oracle script, or this workflow. Otherwise it is skipped,
# which a required check counts as passed. go.mod and testdata/parity are not
# among them: the refresh's bump PR changes only those, after the refresh ran
# the live gate on that very artifact. Dispatch with full to run it anyway.
#
# stock: pkg/stock/pg's Postgres tests, against an empty Postgres 17 the
# job starts (no dump): the stock connector (ADR 0020) reads views over the
# synthetic shelf and yard (testdata/vocab/stock/live/views.sql) and must
# answer every fit as the same rows loaded as files do, and degrade to
# unavailable on a missing column, a slow query, a full pool, a dead
# database. It takes about a minute, so it runs for every path this
# workflow watches.
name: Tests

on:
  pull_request:
    paths:
      - pkg/**
      - cmd/**
      - go.mod
      - go.sum
      - mise.toml
      - mise.lock
      - .github/actions/mise/**
      - testdata/parity/**
      - testdata/vocab/**
      - scripts/oracle.sh
      - .github/workflows/import.yml
      - "!**/*.md"
  # main's runs seed the Go cache that pull requests restore: a PR's own
  # cache entries are visible to that PR alone.
  push:
    branches: [main]
    paths:
      - pkg/**
      - cmd/**
      - go.mod
      - go.sum
      - mise.toml
      - mise.lock
      - .github/actions/mise/**
      - testdata/parity/**
      - testdata/vocab/**
      - scripts/oracle.sh
      - .github/workflows/import.yml
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      full:
        description: Run the Postgres job whatever the branch changes
        type: boolean
        default: false
      month:
        description: Data month YYYY_MM for the Postgres job; empty means the newest one NHTSA publishes
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash adds -o pipefail, so `| tee` cannot hide a failed test.
    shell: bash

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.paths.outputs.postgres }}
    steps:
      # The files the branch changes since it left the base, from the compare
      # API: no checkout. 300 is the most it lists; at that, run everything.
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          postgres=false
          if [ "$EVENT" = push ]; then
            echo "push to main: the pull request ran the Postgres job"
          elif [ "$FULL" = true ]; then
            echo "dispatched with full"
            postgres=true
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files // [] | .[].filename')
            n=$(grep -c . <<<"$files" || true)
            echo "$n files changed since $BASE"
            if [ "$n" -ge 300 ]; then
              postgres=true
            fi
            while IFS= read -r f; do
              case "$f" in
                *.md) ;;
                pkg/decoder/* | pkg/contract/* | cmd/nitrovin-import/* | scripts/oracle.sh | .github/workflows/import.yml)
                  echo "Postgres: $f"
                  postgres=true ;;
              esac
            done <<<"$files"
          fi
          echo "postgres=$postgres" | tee -a "$GITHUB_OUTPUT"

  artifact:
    name: Artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go jq
      # Modules and the build cache, named by the Go version, go.sum and the
      # Go sources; a miss restores the nearest entry and saves its own.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      - name: The pinned artifact
        run: |
          dir=$(go mod download -json github.com/joshuasprow/nitrovin-data | jq -r .Dir)
          echo "NITROVIN_ARTIFACT=$dir/pkg/embedded/nitrovin.artifact" | tee -a "$GITHUB_ENV"
          jq -r '"data month \(.data_month), \(.bytes) bytes, blake3 \(.blake3)"' "$dir/pkg/embedded/manifest.json"

      # The Postgres tests skip here: no NITROVIN_PSQL. Every other one must
      # pass: a test that skipped for want of an artifact fails the job.
      - name: Test on the artifact
        run: |
          go test -count=1 -v -timeout 10m ./pkg/... ./cmd/nitrovin/ ./cmd/nitrovin-import/ | tee "$RUNNER_TEMP/test.log"
          for t in TestParity TestEngineAnswerKey TestDecodeAnswerKey TestText TestStdio TestRefusedLine \
                   TestDataPrecedence TestMCPSession TestServeContract TestForm TestVinsCoversTheMonth; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/test.log" || { echo "artifact: $t did not pass" >&2; exit 1; }
          done

  postgres:
    name: Postgres
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # The custom dump is archive format 1.16: pg_restore 17 or newer.
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vpic
          # Collate C, as oracle.yml and scripts/oracle.sh up: restore refuses
          # any other collation.
          POSTGRES_INITDB_ARGS: --lc-collate=C
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go jq
      # Its own entry (it saves after the artifact job), falling back to the
      # artifact job's, which main's runs keep current.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      - name: Resolve data month
        id: month
        env:
          MONTH: ${{ inputs.month }}
        run: echo "month=${MONTH:-$(scripts/oracle.sh month)}" >>"$GITHUB_OUTPUT"

      - name: Fetch dump
        id: fetch
        run: scripts/oracle.sh fetch "${{ steps.month.outputs.month }}" "$RUNNER_TEMP/dump" | tee -a "$GITHUB_OUTPUT"

      - name: Restore dump
        env:
          # The job context is not available in job-level env.
          ORACLE_CONTAINER: ${{ job.services.postgres.id }}
        run: scripts/oracle.sh restore "${{ steps.fetch.outputs.backup }}"

      - name: Test the importer against the dump
        env:
          NITROVIN_PSQL: docker exec -i ${{ job.services.postgres.id }} psql -X -q -U postgres -d vpic
          NITROVIN_MONTH: ${{ steps.fetch.outputs.month }}
        # A skipped TestPostgres would pass silently: require that it ran.
        run: |
          go test -count=1 -v -run 'TestPostgres$' ./cmd/nitrovin-import/ | tee "$RUNNER_TEMP/test.log"
          grep -q -- '--- PASS: TestPostgres' "$RUNNER_TEMP/test.log"

      - name: Test the engine against the dump
        env:
          NITROVIN_PSQL: docker exec -i ${{ job.services.postgres.id }} psql -X -q -U postgres -d vpic
          NITROVIN_ARTIFACT: ${{ runner.temp }}/nitrovin.artifact
        run: |
          go run ./cmd/nitrovin-import sql | $NITROVIN_PSQL |
            go run ./cmd/nitrovin-import build -month "${{ steps.fetch.outputs.month }}" \
              -o "$NITROVIN_ARTIFACT" -manifest "$RUNNER_TEMP/nitrovin.json"
          go test -count=1 -v -timeout 30m ./pkg/decoder/ | tee "$RUNNER_TEMP/engine.log"
          for t in TestMatcherPostgres TestCorePostgres TestCharsetPostgres TestWrapperPostgres \
                   TestProjectionPostgres TestElementAttributeValuePostgres; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/engine.log" || { echo "postgres: $t did not pass" >&2; exit 1; }
          done
          # The frozen key is one month's (its manifest says which); on
          # another month TestParity skips until the refresh renews the key.
          if [ "${{ steps.fetch.outputs.month }}" = "$(jq -r .month testdata/parity/*/manifest.json)" ]; then
            grep -q -- '--- PASS: TestParity ' "$RUNNER_TEMP/engine.log"
          fi

  stock:
    name: Stock connector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # The oracle's image, by the same digest: scripts/tools.sh holds
        # every workflow to one.
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-stock-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-stock-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      # pkg/stock/pg's Postgres tests skip without NITROVIN_STOCK_PG_DSN, so
      # a skip would pass silently: require that each one ran.
      - name: Test the connector against Postgres
        env:
          NITROVIN_STOCK_PG_DSN: postgres://postgres:postgres@localhost:5432/stock?sslmode=disable
        run: |
          go test -count=1 -race -v ./pkg/stock/pg/ | tee "$RUNNER_TEMP/stock.log"
          for t in TestParityPostgres TestUnavailablePostgres TestRowsPostgres TestSlowPostgres \
                   TestChangedPostgres TestVPICPostgres TestLostPostgres TestNoCatalogPostgres; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/stock.log" || { echo "stock: $t did not pass" >&2; exit 1; }
          done
