# The C library on all six targets: one ubuntu job builds libnitrovin for
# linux, darwin and windows on amd64 and arm64 with zig cc
# (scripts/libnitrovin.sh); each library is then loaded through Python's ctypes
# on its own OS and architecture, opens a real artifact with nitrovin_open, and
# must answer every line of cmd/libnitrovin/testdata/requests.jsonl with
# exactly the reply `nitrovin stdio` gave on the same artifact, in order and
# from eight threads on one handle (cmd/libnitrovin/testdata/smoke.py). It
# then opens the artifact with the testdata/vocab fixture and the synthetic
# catalog in testdata/vocab/fitment with its stock in testdata/vocab/stock
# through nitrovin_open_vocab, and must
# answer vocab-requests.jsonl's decodes, translations, lists and fits as
# `nitrovin --vocab testdata/vocab --vocab testdata/vocab/fitment --vocab testdata/vocab/stock stdio` did.
# The artifact is the one go.mod pins (nitrovin-data's pkg/embedded, from the
# module cache): no dump, no Postgres.
#
# It runs for the library and the packages it links (go list -deps
# ./cmd/libnitrovin): pkg/stdio, pkg/nitrovin, pkg/contract, pkg/decoder,
# pkg/vocab, pkg/fitment, and go.mod for nitrovin-data's; and for the
# fixtures. The main command and the importer are not among them.
name: C library

on:
  pull_request:
    paths: &paths
      - cmd/libnitrovin/**
      - pkg/stdio/**
      - pkg/nitrovin/**
      - pkg/contract/**
      - pkg/fitment/**
      - pkg/decoder/**
      - pkg/vocab/**
      - testdata/vocab/*.jsonl
      - testdata/vocab/fitment/*.jsonl
      - testdata/vocab/stock/*.jsonl
      - go.mod
      - mise.toml
      - mise.lock
      - .github/actions/mise/**
      - scripts/libnitrovin.sh
      - .github/workflows/libnitrovin.yml
      - "!**/*.md"
  # main's runs seed the Go and zig caches that pull requests restore: a PR's
  # own cache entries are visible to that PR alone.
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: mise
        with:
          tools: go zig
      # The six cross builds' Go cache, named as import.yml names its own.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-libnitrovin-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-libnitrovin-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-libnitrovin-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go-version }}-
      # Zig's global cache, where zig cc keeps each target's libc: in $HOME,
      # never in the checkout, named by the pinned zig version and the build script.
      - name: Zig's global cache
        run: |
          echo "ZIG_GLOBAL_CACHE_DIR=$HOME/.cache/zig" >>"$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$HOME/.cache/zig" >>"$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.zig-version }}-${{ hashFiles('scripts/libnitrovin.sh') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.zig-version }}-
      # (devel), as the nitrovin that writes the replies below reports.
      - run: scripts/libnitrovin.sh dist
        env:
          GOFLAGS: -buildvcs=false
      - uses: actions/upload-artifact@v7
        with:
          name: libnitrovin
          path: dist/
          if-no-files-found: error

  # The artifact and the replies the libraries must give: `nitrovin stdio`
  # over the requests, every one with a fixed now.
  replies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      month: ${{ steps.artifact.outputs.month }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mise
        id: go
        with:
          tools: go jq
      # Falls back to import.yml's artifact entry, a superset of this build.
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-replies-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-replies-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-replies-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-

      # The data month only names the uploaded artifact.
      - name: The pinned artifact
        id: artifact
        run: |
          dir=$(go mod download -json github.com/joshuasprow/nitrovin-data | jq -r .Dir)
          mkdir smoke
          cp "$dir/pkg/embedded/nitrovin.artifact" smoke/nitrovin.artifact
          echo "month=$(jq -r .data_month "$dir/pkg/embedded/manifest.json")" | tee -a "$GITHUB_OUTPUT"

      - name: stdio's replies
        run: |
          # -buildvcs=false: the libraries report "(devel)" too.
          go build -buildvcs=false -o "$RUNNER_TEMP/nitrovin" ./cmd/nitrovin
          "$RUNNER_TEMP/nitrovin" stdio --data smoke/nitrovin.artifact \
            <cmd/libnitrovin/testdata/requests.jsonl >smoke/replies.jsonl
          "$RUNNER_TEMP/nitrovin" --vocab testdata/vocab --vocab testdata/vocab/fitment --vocab testdata/vocab/stock stdio --data smoke/nitrovin.artifact \
            <cmd/libnitrovin/testdata/vocab-requests.jsonl >smoke/vocab-replies.jsonl

      - uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ steps.artifact.outputs.month }}
          path: smoke/
          if-no-files-found: error

  smoke:
    needs: [build, replies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-amd64, lib: libnitrovin.so, python: x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, lib: libnitrovin.so, python: arm64 }
          - { os: macos-15-intel, target: darwin-amd64, lib: libnitrovin.dylib, python: x64 }
          - { os: macos-15, target: darwin-arm64, lib: libnitrovin.dylib, python: arm64 }
          - { os: windows-2025, target: windows-amd64, lib: libnitrovin.dll, python: x64 }
          - { os: windows-11-arm, target: windows-arm64, lib: libnitrovin.dll, python: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The interpreter must match the library's architecture.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: libnitrovin
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: smoke-${{ needs.replies.outputs.month }}
          path: smoke
      - run: |
          python -c 'import platform, struct; print(platform.platform(), platform.machine(), struct.calcsize("P") * 8, "bit")'
          python cmd/libnitrovin/testdata/smoke.py "dist/${{ matrix.target }}/${{ matrix.lib }}" \
            smoke/nitrovin.artifact cmd/libnitrovin/testdata/requests.jsonl smoke/replies.jsonl \
            cmd/libnitrovin/testdata/vocab-requests.jsonl smoke/vocab-replies.jsonl testdata/vocab/*.jsonl testdata/vocab/fitment/*.jsonl testdata/vocab/stock/*.jsonl
