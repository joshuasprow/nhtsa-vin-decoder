# corgi's Node, for the README's benchmarks (docs/benchmarks.md): Node 22,
# because corgi v2's better-sqlite3 9 has no build for Node 24 and later.
# 22.23.4 is the version the published corgi rows ran on.
#
# mise reads this file in this directory and below, over the checkout's
# mise.toml, so only node changes here; the rest of the checkout, CI and the
# Worker keep the root pin. mise.lock beside it holds each platform's URL
# and sha256. scripts/bench.sh corgi installs it with
# `mise -C bench/decode install --locked node` and runs corgi here.
#
# Held, not tracked upstream: the pin is the Node docs/benchmarks.json's
# corgi rows record, and moves only when those rows are re-run. Edit the
# version, then in this directory
#   mise lock --platform macos-arm64,macos-x64,linux-x64,linux-arm64,windows-x64
# re-run the corgi rows (docs/benchmarks.md, Reproduce), and commit the three
# files together. scripts/tools.sh check fails while they differ; tools.yml's
# weekly check leaves this pin out.

[tools]
node = "22.23.4"
